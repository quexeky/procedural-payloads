[package]
name = "procedural-payloads"
version = "0.1.0"
edition = "2024"

[features]
default = []
async = ["dep:embedded-io-async"]

[dependencies]
embedded-io = "0.7.1"
embedded-io-async = { version = "0.7.0", optional = true }
crc32fast = { version = "1.5.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
zerocopy = { version = "0.8.56", features = ["derive"] }

[[example]]
name = "embassy"
required-features = ["async"]
